services:
  aivora-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      - JwtSettings__Secret=${JwtSettings__Secret}
      - JwtSettings__Issuer=${JwtSettings__Issuer}
      - JwtSettings__Audience=${JwtSettings__Audience}
      - JwtSettings__ExpiryInMinutes=${JwtSettings__ExpiryInMinutes}
      - CloudinaryOptions__CloudName=${CloudinaryOptions__CloudName}
      - CloudinaryOptions__ApiKey=${CloudinaryOptions__ApiKey}
      - CloudinaryOptions__ApiSecret=${CloudinaryOptions__ApiSecret}
      - AIProvider__Provider=${AIProvider__Provider:-Mock}
      - AIProvider__ApiKey=${AIProvider__ApiKey}
      - AIProvider__BaseUrl=${AIProvider__BaseUrl:-https://generativelanguage.googleapis.com}
      - AIProvider__Model=${AIProvider__Model:-gemini-2.5-flash}
      - AIProvider__EnableFallback=${AIProvider__EnableFallback:-true}
      - RateLimit__Strict__PermitLimit=${RateLimit__Strict__PermitLimit:-10}
      - RateLimit__Strict__WindowInMinutes=${RateLimit__Strict__WindowInMinutes:-1}
      - RateLimit__AI__PermitLimit=${RateLimit__AI__PermitLimit:-20}
      - RateLimit__AI__WindowInMinutes=${RateLimit__AI__WindowInMinutes:-1}
      - RateLimit__General__PermitLimit=${RateLimit__General__PermitLimit:-100}
      - RateLimit__General__WindowInMinutes=${RateLimit__General__WindowInMinutes:-1}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=aivora
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespw
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
