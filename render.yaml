services:
  - type: web
    name: aivora-backend
    env: docker
    plan: free
    region: singapore # Hoặc region bạn đang dùng
    dockerContext: Backend
    dockerfilePath: Dockerfile
    healthCheckPath: /api/v1/jobs # Đường dẫn kiểm tra sức khỏe
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: aivora-db
          property: connectionString
      - key: JwtSettings__Secret
        sync: false # Bạn sẽ cấu hình trên giao diện Render một lần
      - key: JwtSettings__Issuer
        value: AivoraApi
      - key: JwtSettings__Audience
        value: AivoraClient
      - key: JwtSettings__ExpiryInMinutes
        value: 1440
      - key: CloudinaryOptions__CloudName
        sync: false
      - key: CloudinaryOptions__ApiKey
        sync: false
      - key: CloudinaryOptions__ApiSecret
        sync: false
      - key: AIProvider__Provider
        value: Gemini
      - key: AIProvider__ApiKey
        sync: false
      - key: AIProvider__EnableFallback
        value: false
      - key: RateLimit__Strict__PermitLimit
        value: 10
      - key: RateLimit__Strict__WindowInMinutes
        value: 1
      - key: RateLimit__AI__PermitLimit
        value: 20
      - key: RateLimit__AI__WindowInMinutes
        value: 1
      - key: RateLimit__General__PermitLimit
        value: 100
      - key: RateLimit__General__WindowInMinutes
        value: 1

databases:
  - name: aivora-db
    plan: free
    region: singapore
    databaseName: aivora
    user: postgres
