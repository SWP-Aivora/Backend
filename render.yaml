services:
  - type: web
    name: aivora-backend
    env: docker
    plan: free
    region: singapore # Hoặc region bạn đang dùng
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Render free tier: 512MB RAM — keep .NET GC conservative
      - key: DOTNET_GCHeapHardLimit
        value: 0x1C000000  # ~450MB, leaves room for native/DB connections
      # Connection string from Render managed database
      # Maps to ConnectionStrings:DefaultConnection in .NET config
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: aivora-db
          property: connectionString
      - key: JWT_SECRET
        sync: false # Bạn sẽ cấu hình trên giao diện Render một lần
      - key: JWT_ISSUER
        value: AivoraApi
      - key: JWT_AUDIENCE
        value: AivoraClient
      - key: JWT_EXPIRY_IN_MINUTES
        value: 1440
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # AI Provider: set Provider=Gemini + ApiKey to enable real AI; otherwise uses Mock
      - key: AIProvider__Provider
        value: Mock
      - key: AIProvider__ApiKey
        sync: false
      - key: RateLimit__Strict__PermitLimit
        value: 10
      - key: RateLimit__Strict__WindowInMinutes
        value: 1
      - key: RateLimit__AI__PermitLimit
        value: 20
      - key: RateLimit__AI__WindowInMinutes
        value: 1
      - key: RateLimit__General__PermitLimit
        value: 100
      - key: RateLimit__General__WindowInMinutes
        value: 1

databases:
  - name: aivora-db
    plan: free
    region: singapore
    databaseName: aivora
    user: postgres
