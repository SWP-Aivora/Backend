# Required metadata
sonar.projectKey=aivora-backend
sonar.organization=swp-aivora
sonar.projectName=Aivora Backend
sonar.projectVersion=1.0.0

# Source and test paths
sonar.sources=.
sonar.tests=.
sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**,.git/**,.github/**,**/*.Tests.csproj

# C# specific settings
sonar.language=cs
sonar.cs.vs.test.project.pattern=**/*Test*.cs
sonar.cs.analyze.test.files=true

# Coverage settings
sonar.coverage.exclusions=Aivora.Repositories/**/*,Aivora.Services/**/*
sonar.coverage.reportPaths=**/TestResults/coverage.xml

# Quality gate settings
sonar.qualitygate=true
sonar.scm.provider=git

# Analysis settings
sonar.pullrequest.github.repository=SWP-Aivora/Backend
sonar.pullrequest.github.enabled=true
sonar.pullrequest.key=${{ github.event.pull_request.number }}
sonar.pullrequest.branch=${{ github.ref }}
sonar.pullrequest.base=${{ github.event.pull_request.base.ref }}