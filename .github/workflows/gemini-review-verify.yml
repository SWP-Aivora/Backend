name: "Gemini review: verify and post"

on:
  workflow_call:
    inputs:
      model:
        type: string
        required: true
      repo:
        type: string
        required: true
      pr_number:
        type: string
        required: true
      pr_title:
        type: string
        required: false
      pr_body:
        type: string
        required: false
      pr_author:
        type: string
        required: false
      head_sha:
        type: string
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  run:
    name: Gemini
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v4
        with:
          name: pr-diff
      - uses: actions/download-artifact@v4
        with:
          pattern: issues-*
          merge-multiple: true
      - env:
          GEMINI_AI_KEY: ${{ secrets.GEMINI_AI_KEY }}
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          MODEL: ${{ inputs.model }}
          REPO: ${{ inputs.repo }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_BODY: ${{ inputs.pr_body }}
          PR_AUTHOR: ${{ inputs.pr_author }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: python3 .github/scripts/review_bot.py verify
