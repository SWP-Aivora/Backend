name: Aivora Backend CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: aivora_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore Aivora.sln

    - name: Check formatting
      run: dotnet format Aivora.sln --verify-no-changes --verbosity diag

    - name: Build
      run: dotnet build Aivora.sln --no-restore -c Release

    - name: Test
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=aivora_test;Username=postgres;Password=postgrespw"
        JwtSettings__Secret: "test-secret-key-at-least-32-characters-long!"
        JwtSettings__Issuer: "test-issuer"
        JwtSettings__Audience: "test-audience"
        JwtSettings__ExpiryInMinutes: "60"
        CloudinaryOptions__CloudName: "test-cloud"
        CloudinaryOptions__ApiKey: "test-api-key"
        CloudinaryOptions__ApiSecret: "test-api-secret"
        AIProvider__Provider: "Mock"
      run: dotnet test Aivora.sln --no-build -c Release --verbosity normal

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Trigger Render Deploy
        run: |
          echo "Deploying to Render..."
          curl -f ${{ secrets.RENDER_DEPLOY_HOOK }}
          echo "Deploy triggered successfully"
