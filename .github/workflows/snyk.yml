name: Snyk Security Scan

on:
  schedule:
    - cron: '0 2 * * *'  # 2AM daily
  workflow_dispatch:
  pull_request:
    branches: [ main, develop ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk Test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk auth $SNYK_TOKEN
          snyk test --org=aivora --all-projects --json > snyk-results.json

      - name: Create GitHub Issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('snyk-results.json', 'utf8'));

            for (const issue of results.vulnerabilities) {
              if (issue.severity === 'high' || issue.severity === 'critical') {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `🚨 Security Vulnerability: ${issue.title}`,
                  body: `**Severity:** ${issue.severity}
**From:** ${issue.from}
**Package:** ${issue.name}
**Description:** ${issue.title}

**Fix:** Update to version ${issue.patchedVersions?.[0] || 'Check Snyk dashboard for available fixes'}

**More info:** https://snyk.io/vuln/${issue.id}

---
*Auto-generated by Snyk Security Scan*`,
                  labels: ['security', 'automated']
                });
              }
            }